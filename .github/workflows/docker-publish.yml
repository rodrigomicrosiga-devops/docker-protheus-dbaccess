name: Docker Build & Push DbAccess to Docker Hub

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build-and-push:
    name: Build and Push DbAccess Image on Local Infrastructure
    runs-on: self-hosted  # 🚀 Aciona o seu runner global da organização

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      # 🚀 Resgata o instalador local no Workspace temporário sem expor caminhos absolutos no Dockerfile
      - name: Resgatar Instalador Local no Workspace
        run: |
          cp ../../dbaccess.tar.gz . 2>/dev/null || cp "${{ github.workspace }}/../dbaccess.tar.gz" . 2>/dev/null || cp /media/rodrigo/dados/docker-protheus-dbaccess/dbaccess.tar.gz .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }} # Herdado globalmente da Organização
          password: ${{ secrets.DOCKERHUB_TOKEN }}    # Herdado globalmente da Organização

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: rodrigomicrosiga/dbaccess-dev:24.1.1  # 🎯 Tag única e imutável para governança sênior